
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QM PROFITER - Charts</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    padding-left:260px;
    background:#080d18;
    color:white;
    font-family:Arial,sans-serif;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:235px;
    height:100vh;
    background:#0b1423;
    border-right:1px solid #202d43;
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    z-index:1000;
    transition:width .25s ease;
}

.sidebar-brand{
    color:#20d9a0;
    font-size:21px;
    font-weight:bold;
    padding:10px 12px 25px;
    white-space:nowrap;
    overflow:hidden;
}

.nav-toggle{
    width:100%;
    padding:11px;
    margin-bottom:20px;
    background:#111e30;
    border:1px solid #293952;
    color:#20d9a0;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.nav-links{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.nav-link{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 12px;
    border-radius:8px;
    color:#aab7ca;
    text-decoration:none;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    transition:.2s;
}

.nav-link:hover,
.nav-link.active{
    background:#13283a;
    color:#20d9a0;
}

.nav-icon{
    width:21px;
    height:21px;
    min-width:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.nav-label{overflow:hidden}

.sidebar-footer{
    margin-top:auto;
    color:#637189;
    font-size:10px;
    text-align:center;
    padding:15px 5px;
}

.sidebar.icons-only{width:88px}

.sidebar.icons-only .sidebar-brand{
    font-size:16px;
    padding-left:7px;
}

.sidebar.icons-only .nav-label,
.sidebar.icons-only .sidebar-footer{
    display:none;
}

.sidebar.icons-only .nav-link{
    justify-content:center;
    padding:13px 5px;
}

.sidebar.icons-only .nav-toggle{
    font-size:0;
    padding:11px 5px;
}

.sidebar.icons-only .nav-toggle::after{
    content:"☰";
    font-size:19px;
}

body.icons-only{padding-left:110px}

h1{
    color:#00e5a0;
    letter-spacing:2px;
}

.back{
    display:inline-block;
    color:#00e5a0;
    text-decoration:none;
    margin-bottom:20px;
}

.chart{
    height:650px;
    width:100%;
}

@media(max-width:700px){
    body{padding:12px;padding-left:100px}
    .sidebar{width:88px}
    .sidebar .nav-label,
    .sidebar .sidebar-footer{display:none}
    .sidebar .nav-link{justify-content:center;padding:13px 5px}
    .sidebar .sidebar-brand{font-size:16px;padding-left:7px}
    .sidebar .nav-toggle{font-size:0;padding:11px 5px}
    .sidebar .nav-toggle::after{content:"☰";font-size:19px}
    .chart{height:550px}
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">QM PROFITER</div>

    <button class="nav-toggle" id="navToggle">☰ Icons Only</button>

        </a>

        <a href="signals.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
            <span class="nav-label">Signals</span>
        </a>

        <a href="chart.html" class="nav-link active">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M3 3v18h18"/>
                <path d="M7 14h2v4H7zM12 8h2v10h-2zM17 4h2v14h-2z"/>
            </svg>
            <span class="nav-label">Charts</span>

        <a href="calculator.html" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <rect x="4" y="2" width="16" height="20" rx="2"/>
                <path d="M8 6h8"/>
                <path d="M8 11h.01M12 11h.01M16 11h.01"/>
                <path d="M8 15h.01M12 15h.01M16 15h.01"/>
                <path d="M8 19h.01M12 19h.01M16 19h.01"/>
            </svg>
            <span class="nav-label">Calculator</span>

        <a href="history.html" class="nav-link">

    </nav>

    <div class="sidebar-footer">Powered by Shenal Shashika</div>

</aside>

<a class="back" href="index.html">← Back to Dashboard</a>

<h1>QM PROFITER | LIVE CHARTS</h1>

<p>Market analysis chart</p>

<div class="chart">
    <div class="tradingview-widget-container"
         style="height:100%;width:100%">

        <div class="tradingview-widget-container__widget"
             style="height:100%;width:100%"></div>

        <script
            type="text/javascript"
            src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
            async>
        {
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "allow_symbol_change": true,
            "hide_side_toolbar": false,
            "withdateranges": true,
            "details": true,
            "hotlist": false,
            "calendar": false,
            "support_host": "https://www.tradingview.com"
        }
        </script>

    </div>
</div>

<script>
const sidebar=document.getElementById("sidebar");
const navToggle=document.getElementById("navToggle");

function applyNavigationMode(){
    const iconsOnly=localStorage.getItem("qmNavigationMode")==="icons";
    sidebar.classList.toggle("icons-only",iconsOnly);
    document.body.classList.toggle("icons-only",iconsOnly);
    navToggle.textContent=iconsOnly?"☰ Show Labels":"☰ Icons Only";
}

navToggle.addEventListener("click",function(){
    const currentlyIcons=sidebar.classList.contains("icons-only");
    localStorage.setItem("qmNavigationMode",currentlyIcons?"labels":"icons");
    applyNavigationMode();
});

applyNavigationMode();
</script>

</body>
</html>
