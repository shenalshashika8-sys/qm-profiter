
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QM PROFITER - VIP Signals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --black:#080808;
    --panel:rgba(19,19,19,.88);
    --yellow:#ffd400;
    --red:#ff3030;
    --white:#f5f5f5;
    --muted:#aaa9a5;
    --border:rgba(255,212,0,.24);
}
*{margin:0;padding:0;box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{
    background:var(--black);color:var(--white);
    font-family:Arial,sans-serif;min-height:100vh;
    position:relative;isolation:isolate;overflow-x:hidden
}
body::before{
    content:"";position:fixed;inset:-45%;z-index:0;pointer-events:none;
    background:
    radial-gradient(ellipse at 15% 20%,rgba(255,212,0,.34),transparent 30%),
    radial-gradient(ellipse at 85% 25%,rgba(255,35,35,.30),transparent 32%),
    radial-gradient(ellipse at 50% 80%,rgba(255,160,0,.20),transparent 35%),
    radial-gradient(ellipse at 90% 90%,rgba(170,0,0,.23),transparent 30%);
    filter:blur(65px);animation:rockGlow 13s ease-in-out infinite alternate
}
body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
    radial-gradient(circle,rgba(255,212,0,.8) 1px,transparent 2px),
    radial-gradient(circle,rgba(255,50,30,.7) 1px,transparent 2px),
    radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 2px);
    background-size:160px 160px,230px 230px,300px 300px;
    background-position:0 0,70px 50px,120px 100px;
    animation:rockParticles 28s linear infinite
}
@keyframes rockGlow{
    0%{transform:translate(-7%,-5%) rotate(0deg) scale(1)}
    50%{transform:translate(7%,5%) rotate(10deg) scale(1.15)}
    100%{transform:translate(-5%,8%) rotate(-10deg) scale(1.08)}
}
@keyframes rockParticles{
    from{background-position:0 0,70px 50px,120px 100px}
    to{background-position:300px 300px,-150px 350px,400px -200px}
}
.container{max-width:1250px;margin:auto;padding:30px;position:relative;z-index:1}
.header{
    display:flex;justify-content:space-between;align-items:center;
    gap:15px;flex-wrap:wrap;margin-bottom:30px
}
.header h1{
    font-size:30px;font-weight:900;letter-spacing:1px;color:var(--yellow);
    text-shadow:0 0 15px rgba(255,212,0,.35)
}
.header p{color:var(--muted);margin-top:8px;font-size:13px;letter-spacing:1px}
.back-btn{
    background:rgba(255,212,0,.08);color:var(--yellow);
    border:1px solid rgba(255,212,0,.45);padding:12px 19px;
    border-radius:7px;text-decoration:none;font-weight:bold;transition:.25s
}
.back-btn:hover{background:var(--yellow);color:#080808}
.section{
    background:var(--panel);backdrop-filter:blur(15px);
    border:1px solid var(--border);border-radius:13px;
    padding:25px;margin-bottom:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    position:relative;overflow:hidden
}
.section::before{
    content:"";position:absolute;top:0;left:0;width:75px;height:3px;
    background:var(--yellow);box-shadow:0 0 12px var(--yellow)
}
.section h2{font-size:20px;margin-bottom:20px;color:var(--white)}
.admin-section{display:none;border-color:rgba(255,48,48,.55)}
.admin-section::before{background:var(--red);box-shadow:0 0 12px var(--red)}
.admin-tag{
    display:inline-block;background:rgba(255,48,48,.15);color:#ff7777;
    border:1px solid rgba(255,48,48,.5);padding:5px 10px;
    border-radius:4px;font-size:10px;margin-left:8px;letter-spacing:1px
}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.field{display:flex;flex-direction:column;gap:8px}
.field.full{grid-column:1/-1}
.field label{color:var(--yellow);font-size:12px;font-weight:bold}
.field input,.field select,.field textarea{
    width:100%;padding:13px;border-radius:6px;
    border:1px solid #39352a;background:rgba(5,5,5,.92);
    color:white;outline:none;font-size:14px
}
.field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--yellow);box-shadow:0 0 12px rgba(255,212,0,.16)
}
.field select option{background:#111;color:white}
.field textarea{min-height:120px;resize:vertical}
.primary-btn{
    background:linear-gradient(100deg,#ffd400,#ff9900);
    color:#080808;border:none;padding:13px 22px;border-radius:6px;
    font-weight:900;cursor:pointer;margin-top:18px
}
.primary-btn:hover{box-shadow:0 0 20px rgba(255,212,0,.45)}
.primary-btn:disabled{opacity:.6;cursor:not-allowed}
.secondary-btn{
    background:#252525;color:var(--yellow);border:1px solid #625018;
    padding:10px 16px;border-radius:6px;cursor:pointer
}
.delete-btn{
    background:rgba(255,48,48,.14);color:#ff7777;
    border:1px solid rgba(255,48,48,.5);
    padding:10px 16px;border-radius:6px;cursor:pointer
}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filter-btn{
    padding:9px 16px;background:#171717;border:1px solid #393939;
    color:#bdbdbd;border-radius:6px;cursor:pointer;font-weight:bold
}
.filter-btn.active{background:var(--yellow);border-color:var(--yellow);color:#080808}
.signal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.signal-card{
    background:rgba(12,12,12,.90);backdrop-filter:blur(12px);
    border:1px solid rgba(255,212,0,.28);border-radius:10px;
    padding:20px;position:relative;overflow:hidden;transition:.25s
}
.signal-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--yellow);box-shadow:0 0 12px rgba(255,212,0,.4)
}
.signal-card:hover{border-color:rgba(255,212,0,.7);transform:translateY(-2px)}
.signal-top{
    display:flex;justify-content:space-between;gap:10px;
    align-items:center;flex-wrap:wrap;margin-bottom:16px
}
.signal-top h3{font-size:21px;color:var(--yellow);font-weight:900}
.direction,.status,.result-badge{
    font-size:11px;font-weight:900;padding:6px 11px;border-radius:4px
}
.buy{background:rgba(255,212,0,.13);color:var(--yellow);border:1px solid rgba(255,212,0,.5)}
.sell{background:rgba(255,48,48,.13);color:#ff6666;border:1px solid rgba(255,48,48,.5)}
.status{background:#292929;color:#ddd}
.status.ACTIVE{background:rgba(255,212,0,.13);color:var(--yellow);border:1px solid rgba(255,212,0,.4)}
.status.COMPLETED{background:rgba(255,255,255,.10);color:white;border:1px solid #777}
.status.CANCELLED{background:rgba(255,48,48,.13);color:#ff7777;border:1px solid rgba(255,48,48,.4)}
.signal-meta{color:#aaa;font-size:12px;margin-bottom:16px}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.price-item{background:rgba(30,30,30,.9);border:1px solid #303030;padding:12px;border-radius:6px}
.price-item small{display:block;color:#aaa;font-size:10px;margin-bottom:7px;font-weight:bold}
.price-item strong{font-size:14px;overflow-wrap:anywhere}
.entry strong{color:white}
.sl{border-color:rgba(255,48,48,.35)}
.sl strong{color:#ff5555}
.tp{border-color:rgba(255,212,0,.25)}
.tp strong{color:var(--yellow)}
.commentary{
    margin-top:18px;padding:15px;border-radius:7px;
    background:rgba(30,25,12,.72);border:1px solid rgba(255,212,0,.17)
}
.commentary h4{font-size:12px;margin-bottom:9px;color:var(--yellow)}
.commentary p{color:#ccc;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.card-footer{
    display:flex;justify-content:space-between;gap:10px;
    align-items:center;flex-wrap:wrap;margin-top:18px;color:#888;font-size:10px
}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.result-panel{
    margin-top:18px;padding:15px;border-radius:8px;
    background:rgba(255,212,0,.06);border:1px solid rgba(255,212,0,.28)
}
.result-panel h4{font-size:12px;color:var(--yellow);margin-bottom:10px}
.result-controls{display:flex;gap:9px;flex-wrap:wrap}
.result-select{
    flex:1;min-width:150px;padding:11px;background:#111;color:white;
    border:1px solid #625018;border-radius:6px
}
.result-save-btn{
    padding:11px 16px;background:var(--yellow);color:#080808;
    border:0;border-radius:6px;font-weight:bold;cursor:pointer
}
.result-save-btn:disabled{opacity:.6;cursor:not-allowed}
.result-badge{display:inline-block;margin-top:12px;background:rgba(255,212,0,.12);color:var(--yellow);border:1px solid rgba(255,212,0,.4)}
.result-time{display:block;margin-top:8px;color:#999;font-size:11px}
.empty-state{
    text-align:center;color:#aaa;padding:45px 15px;
    background:rgba(15,15,15,.88);border:1px solid #333;border-radius:9px
}
.message{display:none;margin-top:15px;padding:12px;border-radius:6px;font-size:13px}
.message.success{display:block;background:rgba(255,212,0,.12);border:1px solid rgba(255,212,0,.4);color:var(--yellow)}
.message.error{display:block;background:rgba(255,48,48,.12);border:1px solid rgba(255,48,48,.4);color:#ff9999}
footer{text-align:center;color:#888;font-size:11px;padding:18px;letter-spacing:1px}
footer span{color:var(--yellow)}
@media(max-width:750px){
    .container{padding:18px}
    .form-grid{grid-template-columns:1fr 1fr}
    .signal-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
    .form-grid{grid-template-columns:1fr}
    .field.full{grid-column:auto}
    .price-grid{grid-template-columns:repeat(2,1fr)}
    .header h1{font-size:23px}
    .section{padding:18px}
}
@media(prefers-reduced-motion:reduce){
    body::before,body::after{animation:none}
    .signal-card{transition:none}
}
</style>
</head>

<body>
<div class="container">

<header class="header">
    <div>
        <h1>⚡ VIP Signals</h1>
        <p>QM PROFITER · VIP SCENARIO CENTER</p>
    </div>
    <a href="index.html" class="back-btn">← Dashboard</a>
</header>

<section class="section admin-section" id="adminSection">
    <h2>Admin Control Panel <span class="admin-tag">HOST ACCESS</span></h2>

    <form id="signalForm">
        <div class="form-grid">
            <div class="field">
                <label>Coin / Asset</label>
                <input id="coin" type="text" placeholder="BTC/USDT" required>
            </div>
            <div class="field">
                <label>Direction</label>
                <select id="direction" required>
                    <option value="BUY">BUY Scenario</option>
                    <option value="SELL">SELL Scenario</option>
                </select>
            </div>
            <div class="field">
                <label>Timeframe</label>
                <select id="timeframe" required>
                    <option value="1m">1 Minute</option>
                    <option value="5m">5 Minutes</option>
                    <option value="15m">15 Minutes</option>
                    <option value="30m">30 Minutes</option>
                    <option value="1h">1 Hour</option>
                    <option value="4h">4 Hours</option>
                    <option value="1D">1 Day</option>
                    <option value="1W">1 Week</option>
                </select>
            </div>
            <div class="field">
                <label>Entry Reference</label>
                <input id="entry" type="number" step="any" min="0" required>
            </div>
            <div class="field">
                <label>Stop Loss Reference</label>
                <input id="stopLoss" type="number" step="any" min="0" required>
            </div>
            <div class="field">
                <label>TP1 Reference</label>
                <input id="tp1" type="number" step="any" min="0" required>
            </div>
            <div class="field">
                <label>TP2 Reference</label>
                <input id="tp2" type="number" step="any" min="0" required>
            </div>
            <div class="field">
                <label>TP3 Reference</label>
                <input id="tp3" type="number" step="any" min="0" required>
            </div>
            <div class="field">
                <label>Scenario Status</label>
                <select id="status" required>
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="COMPLETED">COMPLETED</option>
                    <option value="CANCELLED">CANCELLED</option>
                </select>
            </div>
            <div class="field full">
                <label>Detailed Commentary / Analysis</label>
                <textarea id="commentary" maxlength="5000"
                placeholder="Educational scenario, market context, technical observations, and limitations..."></textarea>
            </div>
        </div>

        <button type="submit" class="primary-btn" id="saveBtn">Publish VIP Scenario</button>
        <button type="button" class="secondary-btn" id="cancelEditBtn" style="display:none" onclick="resetForm()">Cancel Edit</button>
        <div id="adminMessage" class="message"></div>
    </form>
</section>

<section class="section">
    <h2>Published VIP Scenarios & History</h2>
    <div class="filter-row">
        <button class="filter-btn active" data-filter="ALL">All</button>
        <button class="filter-btn" data-filter="ACTIVE">Active</button>
        <button class="filter-btn" data-filter="COMPLETED">Completed / History</button>
        <button class="filter-btn" data-filter="CANCELLED">Cancelled</button>
    </div>
    <div id="loading" class="empty-state">Loading VIP scenarios...</div>
    <div id="signalGrid" class="signal-grid"></div>
</section>

<footer>QM PROFITER · <span>Powered by Shenal Shashika</span></footer>
</div>

<script>
const SUPABASE_URL = "https://wuvzojlpegfqwsfhoobc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1dnpvamxwZWdmcXdzZmhvb2JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MTUwMzcsImV4cCI6MjEwOTk5MTAzN30.aL3ijARNugegh-Cge0GXt4QM10RqVM7iFz9AlNgReuQ";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const HOST_EMAIL = "jathushara54@gmail.com";

const RESULT_OPTIONS = [
    "HIT_SL",
    "HIT_TP1",
    "HIT_TP2",
    "HIT_TP3",
    "BE"
];

const RESULT_LABELS = {
    HIT_SL: "HIT SL",
    HIT_TP1: "HIT TP1",
    HIT_TP2: "HIT TP2",
    HIT_TP3: "HIT TP3",
    BE: "BREAK EVEN (BE)"
};

let currentUser = null;
let isAdmin = false;
let allSignals = [];
let currentFilter = "ALL";
let editingId = null;

const form = document.getElementById("signalForm");
const signalGrid = document.getElementById("signalGrid");
const loading = document.getElementById("loading");
const adminSection = document.getElementById("adminSection");
const saveBtn = document.getElementById("saveBtn");
const adminMessage = document.getElementById("adminMessage");

function showMessage(message, type) {
    adminMessage.textContent = message;
    adminMessage.className = "message " + type;
}

function clearMessage() {
    adminMessage.textContent = "";
    adminMessage.className = "message";
}

function resetForm() {
    form.reset();
    editingId = null;
    saveBtn.textContent = "Publish VIP Scenario";
    document.getElementById("cancelEditBtn").style.display = "none";
    clearMessage();
}

function makeElement(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
}

async function initializePage() {
    try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;

        if (!data.session) {
            window.location.href = "login.html";
            return;
        }

        currentUser = data.session.user;
        isAdmin = (currentUser.email || "").toLowerCase() === HOST_EMAIL.toLowerCase();

        if (isAdmin) adminSection.style.display = "block";

        await loadSignals();
    } catch (error) {
        loading.textContent = "Unable to initialize page: " + error.message;
    }
}

async function loadSignals() {
    loading.style.display = "block";
    loading.textContent = "Loading VIP scenarios...";
    signalGrid.replaceChildren();

    const { data, error } = await supabaseClient
        .from("vip_signals")
        .select("*")
        .order("created_at", { ascending: false });

    loading.style.display = "none";

    if (error) {
        signalGrid.appendChild(makeElement(
            "div", "empty-state", "Unable to load scenarios: " + error.message
        ));
        return;
    }

    allSignals = data || [];
    renderSignals();
}

function renderSignals() {
    signalGrid.replaceChildren();

    const filtered = allSignals.filter(signal =>
        currentFilter === "ALL" || signal.status === currentFilter
    );

    if (!filtered.length) {
        signalGrid.appendChild(makeElement(
            "div", "empty-state", "No scenarios available in this category yet."
        ));
        return;
    }

    filtered.forEach(signal => signalGrid.appendChild(createSignalCard(signal)));
}

function createSignalCard(signal) {
    const card = makeElement("article", "signal-card");
    const top = makeElement("div", "signal-top");

    top.append(
        makeElement("h3", "", signal.coin || "Unknown asset"),
        makeElement(
            "span",
            "direction " + (signal.direction === "BUY" ? "buy" : "sell"),
            signal.direction || "N/A"
        ),
        makeElement("span", "status " + signal.status, signal.status)
    );
    card.appendChild(top);

    card.appendChild(makeElement(
        "div", "signal-meta", "Timeframe: " + (signal.timeframe || "N/A")
    ));

    const priceGrid = makeElement("div", "price-grid");
    [
        ["ENTRY", signal.entry, "entry"],
        ["STOP LOSS", signal.stop_loss, "sl"],
        ["TP1", signal.tp1, "tp"],
        ["TP2", signal.tp2, "tp"],
        ["TP3", signal.tp3, "tp"]
    ].forEach(item => {
        const box = makeElement("div", "price-item " + item[2]);
        box.append(
            makeElement("small", "", item[0]),
            makeElement("strong", "", String(item[1] ?? "—"))
        );
        priceGrid.appendChild(box);
    });
    card.appendChild(priceGrid);

    const commentary = makeElement("div", "commentary");
    commentary.append(
        makeElement("h4", "", "HOST COMMENTARY"),
        makeElement("p", "", signal.commentary || "No additional commentary provided.")
    );
    card.appendChild(commentary);

    // Show saved result on completed scenarios.
    if (signal.status === "COMPLETED" && signal.result) {
        const resultPanel = makeElement("div", "result-panel");
        resultPanel.appendChild(makeElement("h4", "", "FINAL SCENARIO RESULT"));
        resultPanel.appendChild(makeElement(
            "span", "result-badge",
            RESULT_LABELS[signal.result] || signal.result
        ));

        if (signal.completed_at) {
            resultPanel.appendChild(makeElement(
                "span", "result-time",
                "Completed: " + new Date(signal.completed_at).toLocaleString()
            ));
        }
        card.appendChild(resultPanel);
    }

    // Admin can record the result of an active scenario.
    if (isAdmin && signal.status === "ACTIVE") {
        const resultPanel = makeElement("div", "result-panel");
        resultPanel.appendChild(makeElement("h4", "", "UPDATE FINAL RESULT"));

        const controls = makeElement("div", "result-controls");
        const select = makeElement("select", "result-select");
        select.setAttribute("aria-label", "Choose final scenario result");

        const placeholder = makeElement("option", "", "Choose result...");
        placeholder.value = "";
        placeholder.disabled = true;
        placeholder.selected = true;
        select.appendChild(placeholder);

        RESULT_OPTIONS.forEach(value => {
            const option = makeElement("option", "", RESULT_LABELS[value]);
            option.value = value;
            select.appendChild(option);
        });

        const resultBtn = makeElement("button", "result-save-btn", "Save Result");
        resultBtn.type = "button";
        resultBtn.addEventListener("click", () => {
            if (!select.value) {
                alert("Please choose a result first.");
                return;
            }
            completeSignal(signal.id, select.value, resultBtn);
        });

        controls.append(select, resultBtn);
        resultPanel.appendChild(controls);
        card.appendChild(resultPanel);
    }

    const footer = makeElement("div", "card-footer");
    const date = signal.created_at
        ? new Date(signal.created_at).toLocaleString()
        : "Date unavailable";

    footer.appendChild(makeElement("span", "", "Published: " + date));

    if (isAdmin) {
        const actions = makeElement("div", "admin-actions");

        const editBtn = makeElement("button", "secondary-btn", "Edit");
        editBtn.type = "button";
        editBtn.addEventListener("click", () => editSignal(signal));

        const deleteBtn = makeElement("button", "delete-btn", "Delete");
        deleteBtn.type = "button";
        deleteBtn.addEventListener("click", () => deleteSignal(signal.id));

        actions.append(editBtn, deleteBtn);
        footer.appendChild(actions);
    }

    card.appendChild(footer);
    return card;
}

async function completeSignal(id, resultValue, button) {
    if (!isAdmin) {
        alert("You do not have host permission.");
        return;
    }

    const confirmed = window.confirm(
        "Save " + RESULT_LABELS[resultValue] +
        " as the final result? This will move the scenario into Completed History."
    );

    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "Saving...";

    try {
        const completionTime = new Date().toISOString();

        const { error } = await supabaseClient
            .from("vip_signals")
            .update({
                status: "COMPLETED",
                result: resultValue,
                completed_at: completionTime,
                updated_at: completionTime
            })
            .eq("id", id)
            .eq("status", "ACTIVE");

        if (error) throw error;

        await loadSignals();
        alert("Result saved successfully. The scenario is now in Completed History.");

    } catch (error) {
        alert("Unable to save result: " + error.message);
        button.disabled = false;
        button.textContent = "Save Result";
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!isAdmin) {
        showMessage("You do not have host permission.", "error");
        return;
    }

    const values = {
        coin: document.getElementById("coin").value.trim().toUpperCase(),
        direction: document.getElementById("direction").value,
        timeframe: document.getElementById("timeframe").value,
        entry: Number(document.getElementById("entry").value),
        stop_loss: Number(document.getElementById("stopLoss").value),
        tp1: Number(document.getElementById("tp1").value),
        tp2: Number(document.getElementById("tp2").value),
        tp3: Number(document.getElementById("tp3").value),
        status: document.getElementById("status").value,
        commentary: document.getElementById("commentary").value.trim()
    };

    const numbers = [
        values.entry, values.stop_loss, values.tp1, values.tp2, values.tp3
    ];

    if (!values.coin || numbers.some(value => !Number.isFinite(value) || value <= 0)) {
        showMessage("Enter an asset and valid positive reference values.", "error");
        return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = editingId ? "Updating..." : "Publishing...";

    try {
        let result;

        if (editingId) {
            result = await supabaseClient
                .from("vip_signals")
                .update({
                    ...values,
                    updated_at: new Date().toISOString()
                })
                .eq("id", editingId);
        } else {
            result = await supabaseClient
                .from("vip_signals")
                .insert([values]);
        }

        if (result.error) throw result.error;

        const wasEditing = Boolean(editingId);
        resetForm();
        showMessage(
            wasEditing ? "Scenario updated successfully." : "Scenario published successfully.",
            "success"
        );
        await loadSignals();

    } catch (error) {
        showMessage("Database error: " + error.message, "error");
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = editingId ? "Update Scenario" : "Publish VIP Scenario";
    }
});

function editSignal(signal) {
    if (!isAdmin) return;

    editingId = signal.id;

    document.getElementById("coin").value = signal.coin || "";
    document.getElementById("direction").value = signal.direction || "BUY";
    document.getElementById("timeframe").value = signal.timeframe || "1m";
    document.getElementById("entry").value = signal.entry ?? "";
    document.getElementById("stopLoss").value = signal.stop_loss ?? "";
    document.getElementById("tp1").value = signal.tp1 ?? "";
    document.getElementById("tp2").value = signal.tp2 ?? "";
    document.getElementById("tp3").value = signal.tp3 ?? "";
    document.getElementById("status").value = signal.status || "ACTIVE";
    document.getElementById("commentary").value = signal.commentary || "";

    saveBtn.textContent = "Update Scenario";
    document.getElementById("cancelEditBtn").style.display = "inline-block";
    clearMessage();

    window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteSignal(id) {
    if (!isAdmin) return;

    if (!window.confirm("Are you sure you want to delete this VIP scenario?")) return;

    const { error } = await supabaseClient
        .from("vip_signals")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Unable to delete scenario: " + error.message);
        return;
    }

    await loadSignals();
}

document.querySelectorAll(".filter-btn").forEach(button => {
    button.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(item =>
            item.classList.remove("active")
        );

        this.classList.add("active");
        currentFilter = this.dataset.filter;
        renderSignals();
    });
});

initializePage();
</script>
