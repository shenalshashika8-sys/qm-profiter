
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QM PROFITER - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080d18;
            color: #e8edf7;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: #111a2b;
            border: 1px solid #263650;
            border-radius: 16px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #42a5ff;
        }

        .subtitle {
            text-align: center;
            color: #8998ad;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #30415c;
            border-radius: 8px;
            background: #080d18;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #1685e8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #ff7777;
        }

        .signup-link {
            margin-top: 22px;
            text-align: center;
            color: #8998ad;
            font-size: 14px;
        }

        .signup-link a {
            color: #42a5ff;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>QM PROFITER</h1>
        <p class="subtitle">Sign in to your account</p>

        <form id="login-form">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="login-button">
                SIGN IN
            </button>

            <p id="message"></p>

        </form>

        <p class="signup-link">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

        <p class="footer">
            Powered by Shenal Shashika
        </p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="login.js"></script>

</body>
</html>
