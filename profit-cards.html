
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QM PROFITER - Profit Cards</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080d18;
    color: #e8edf7;
    min-height: 100vh;
    padding: 25px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 28px;
    color: #ffd400;
}

.header p {
    color: #94a3b8;
    margin-top: 7px;
}

.back-btn, .upload-btn {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

.back-btn {
    background: #1e293b;
    color: white;
}

.upload-btn {
    background: #ffd400;
    color: #080808;
}

.upload-panel {
    display: none;
    background: #101827;
    border: 1px solid #263449;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 25px;
}

.upload-panel h2 {
    margin-bottom: 15px;
    font-size: 19px;
}

.upload-panel input {
    width: 100%;
    padding: 12px;
    background: #080d18;
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
    margin-bottom: 15px;
}

.upload-panel button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #ffd400;
    font-weight: bold;
    cursor: pointer;
}

.status {
    margin-top: 12px;
    color: #94a3b8;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #101827;
    border: 1px solid #263449;
    border-radius: 14px;
    overflow: hidden;
}

.card img {
    width: 100%;
    display: block;
    object-fit: contain;
    max-height: 380px;
    background: #080d18;
}

.card-footer {
    padding: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.card-footer span {
    color: #94a3b8;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.delete-btn {
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    display: none;
}

.empty {
    text-align: center;
    padding: 55px 15px;
    color: #94a3b8;
    background: #101827;
    border: 1px solid #263449;
    border-radius: 14px;
    grid-column: 1 / -1;
}

.empty h2 {
    color: white;
    margin-bottom: 10px;
}

.loading {
    text-align: center;
    padding: 35px;
    color: #94a3b8;
    grid-column: 1 / -1;
}

@media(max-width:600px) {
    body {
        padding: 15px;
    }

    .header h1 {
        font-size: 23px;
    }

    .header {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>🏆 Profit Cards</h1>
            <p>QM PROFITER performance gallery</p>
        </div>

        <a href="index.html" class="back-btn">← Dashboard</a>
    </div>

    <div id="adminPanel" class="upload-panel">
        <h2>Upload New Profit Card</h2>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <button id="uploadBtn" onclick="uploadImage()">
            Upload Profit Card
        </button>

        <div id="uploadStatus" class="status"></div>
    </div>

    <div id="gallery" class="gallery">
        <div class="loading">Loading Profit Cards...</div>
    </div>

</div>

<script>
const SUPABASE_URL = "https://wuvzojlpegfqwsfhoobc.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_Vnp9F9r4AtZmiNLdO8SzBvg_WCb-PF2t";

const ADMIN_EMAIL = "jathushara54@gmail.com";

const BUCKET_NAME = "profit-cards";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

let currentUser = null;
let isAdmin = false;


// CHECK LOGIN
async function checkLogin() {

    const { data, error } = await db.auth.getSession();

    if (error || !data.session) {
        document.getElementById("gallery").innerHTML =
            '<div class="empty"><h2>Login Required</h2><p>Please log in to view Profit Cards.</p></div>';
        return false;
    }

    currentUser = data.session.user;

    isAdmin =
        currentUser.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

    if (isAdmin) {
        document.getElementById("adminPanel").style.display = "block";

        document.querySelectorAll(".delete-btn").forEach(button => {
            button.style.display = "inline-block";
        });
    }

    return true;
}


// LOAD PROFIT CARDS
async function loadCards() {

    const gallery = document.getElementById("gallery");

    gallery.innerHTML =
        '<div class="loading">Loading Profit Cards...</div>';

    const { data, error } = await db.storage
        .from(BUCKET_NAME)
        .list("", {
            limit: 100,
            sortBy: {
                column: "created_at",
                order: "desc"
            }
        });

    if (error) {
        gallery.innerHTML =
            '<div class="empty"><h2>Unable to Load Cards</h2><p>' +
            escapeHTML(error.message) +
            '</p></div>';
        return;
    }

    const files = (data || []).filter(file =>
        file.name && !file.name.startsWith(".")
    );

    if (files.length === 0) {
        gallery.innerHTML =
            '<div class="empty"><h2>No Profit Cards Yet</h2><p>Uploaded cards will appear here.</p></div>';
        return;
    }

    gallery.innerHTML = "";

    for (const file of files) {

        const { data: signedData, error: signedError } =
            await db.storage
                .from(BUCKET_NAME)
                .createSignedUrl(file.name, 3600);

        if (signedError || !signedData?.signedUrl) {
            continue;
        }

        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = signedData.signedUrl;
        img.alt = "Profit Card";
        img.loading = "lazy";

        const footer = document.createElement("div");
        footer.className = "card-footer";

        const filename = document.createElement("span");
        filename.textContent = file.name;

        footer.appendChild(filename);

        if (isAdmin) {
            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Delete";
deleteButton.style.display = "inline-block";
            deleteButton.onclick = () => deleteCard(file.name);

            footer.appendChild(deleteButton);
        }

        card.appendChild(img);
        card.appendChild(footer);

        gallery.appendChild(card);
    }

    if (!gallery.children.length) {
        gallery.innerHTML =
            '<div class="empty"><h2>No Cards Available</h2><p>Could not load the stored images.</p></div>';
    }
}


// UPLOAD IMAGE
async function uploadImage() {

    if (!isAdmin) {
        alert("Only the admin can upload Profit Cards.");
        return;
    }

    const input = document.getElementById("imageInput");
    const status = document.getElementById("uploadStatus");
    const button = document.getElementById("uploadBtn");

    const file = input.files[0];

    if (!file) {
        alert("Please select an image first.");
        return;
    }

    if (!file.type.startsWith("image/")) {
        alert("Please select a valid image.");
        return;
    }

    if (file.size > 10 * 1024 * 1024) {
        alert("Image must be smaller than 10 MB.");
        return;
    }

    button.disabled = true;
    status.textContent = "Uploading...";

    const safeName = file.name
        .replace(/[^a-zA-Z0-9._-]/g, "_");

    const filePath =
        Date.now() + "-" + safeName;

    const { error } = await db.storage
        .from(BUCKET_NAME)
        .upload(filePath, file, {
            cacheControl: "3600",
            upsert: false
        });

    button.disabled = false;

    if (error) {
        status.textContent = "Upload failed: " + error.message;
        return;
    }

    status.textContent = "Profit Card uploaded successfully!";

    input.value = "";

    await loadCards();
}


// DELETE IMAGE
async function deleteCard(fileName) {

    if (!isAdmin) {
        alert("Only the admin can delete Profit Cards.");
        return;
    }

    const confirmed = confirm(
        "Are you sure you want to delete this Profit Card?"
    );

    if (!confirmed) return;

    const { error } = await db.storage
        .from(BUCKET_NAME)
        .remove([fileName]);

    if (error) {
        alert("Delete failed: " + error.message);
        return;
    }

    await loadCards();
}


// SAFE TEXT
function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}


// START
(async function init() {

    const loggedIn = await checkLogin();

    if (loggedIn) {
        await loadCards();
    }

})();

</script>

</body>
</html>
